<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: "Por temas" — barra con lupa, clip destacado grande, filas deslizables por tema; búsqueda y "ver todos" cambian a cuadrícula */
:root{
  --bg:#262924; --bg2:#1C1E1B; --card:#2F332D; --card2:#3A3E37; --line:rgba(255,255,255,.09);
  --fg:#FFFFFF; --muted:#AAAEA8; --coral:#E9604C; --beige:#DABC99;
  --f:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
body{background:linear-gradient(180deg,var(--bg) 0,var(--bg2) 900px) var(--bg2);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;display:flex;flex-direction:column;gap:30px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(38,41,36,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px}
header img{height:34px;width:auto;flex:none}
.sfield{flex:1;display:flex;align-items:center;gap:8px;max-width:440px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-width:0}
.sfield:focus-within{border-color:var(--coral)}
.sfield svg{flex:none;color:var(--muted)}
#q{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;font-size:14px;padding:9px 0;outline:none}
.pill-out{border:2px solid var(--coral);color:var(--coral);border-radius:999px;padding:6px 14px;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;white-space:nowrap;flex:none}
.eyebrow{color:var(--coral);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.intro{padding-top:26px}
h1{font-weight:800;font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:6px 0 0;text-wrap:balance}
h1 em{font-style:normal;color:var(--coral)}

.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:center}
.poster{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:16/9;cursor:pointer;border:0;padding:0;width:100%;display:block}
.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.poster:hover img{transform:scale(1.02)}
.poster .pl{position:absolute;inset:0;display:grid;place-items:center end;padding-right:16%}
.poster .pl i{width:74px;height:74px;border-radius:50%;background:var(--coral);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .2s}
.poster:hover .pl i{transform:scale(1.06)}
.poster .pl i::after{content:"";border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.poster .dur{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.7);border-radius:6px;padding:2px 7px;font-family:var(--mono);font-size:12px}
.poster:focus-visible{outline:3px solid var(--beige);outline-offset:3px}
.htxt{display:flex;flex-direction:column;gap:14px;min-width:0}
.htip{font-weight:700;font-size:clamp(20px,2.6vw,27px);line-height:1.3;margin:0;text-wrap:pretty}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;color:var(--muted);font-size:13px}
.chip{background:var(--card2);color:var(--beige);border-radius:999px;padding:3px 10px;font-weight:600;font-size:12px;white-space:nowrap}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:999px;padding:11px 18px;cursor:pointer;border:0;text-decoration:none;text-align:center;white-space:nowrap;background:var(--coral);color:#fff}
.btn.ghost{background:none;color:var(--fg);border:1.5px solid rgba(255,255,255,.25)}
.btn:focus-visible,.pill-out:focus-visible,.seeall:focus-visible,.tcard:focus-visible,.navb:focus-visible{outline:2px solid var(--beige);outline-offset:2px}

.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:4;background:linear-gradient(180deg,rgba(38,41,36,.97) 75%,rgba(38,41,36,0));margin:-8px calc(-1*max(16px,env(safe-area-inset-left,0px))) -14px;padding:10px max(16px,env(safe-area-inset-left,0px)) 16px}
.tags{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tags::-webkit-scrollbar{display:none}
.tag{font:inherit;font-size:13px;font-weight:500;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap;flex:none}
.tag b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--muted)}
.tag[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff}
.tag[aria-pressed="true"] b{color:#fff}
.tag.vid::before{content:"";border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.tag:focus-visible{outline:2px solid var(--beige);outline-offset:2px}
.shelf{display:flex;flex-direction:column;gap:12px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.shead h2{margin:0;font-size:20px;font-weight:700}
.shead h2 small{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}
.seeall{background:none;border:0;color:var(--coral);font:inherit;font-weight:600;font-size:13px;cursor:pointer;padding:4px 0}
.track{position:relative}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px;scroll-padding-left:0}
.row::-webkit-scrollbar{display:none}
.navb{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(20,22,19,.85);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center;z-index:2}
.navb.l{left:-12px}.navb.r{right:-12px}
.navb[disabled]{opacity:0;pointer-events:none}
.tcard{scroll-snap-align:start;flex:0 0 280px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:left;color:var(--fg);font:inherit;padding:0;min-width:0}
.tcard.v{flex-basis:340px}
.tcard .poster{border-radius:0}
.tcard .poster .pl i{width:46px;height:46px}
.tcard .poster .pl i::after{border-left-width:14px;border-top-width:8px;border-bottom-width:8px;margin-left:4px}
.tb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tb p{margin:0;font-size:14.5px;line-height:1.5}
.tb .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cls{color:var(--muted);font-size:12px}
.more{color:var(--coral);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.more:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.grid .tcard{flex:none}
mark{background:rgba(233,96,76,.3);color:inherit;border-radius:3px;padding:0 2px}
.empty{color:var(--muted);text-align:center;padding:30px;border:1px dashed var(--line);border-radius:18px}
.back{align-self:flex-start}

dialog{border:0;padding:0;background:var(--bg2);color:var(--fg);border-radius:20px;width:min(900px,calc(100vw - 32px));max-height:calc(100vh - 32px);box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:auto}
dialog::backdrop{background:rgba(10,11,10,.8)}
.dlg{position:relative;display:flex;flex-direction:column}
.dlg video{width:100%;aspect-ratio:16/9;background:#000;display:block;max-width:100%}
.dlgb{padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.dlgb p{margin:0;flex:1 1 300px;font-weight:600}
.x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:22px;cursor:pointer;line-height:1;z-index:2}

.foot{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:22px;color:var(--muted);font-size:13px}
footer.foot img{height:28px;width:auto;opacity:.8}
footer.foot p{margin:0;flex:1 1 280px}
footer.foot a{color:var(--fg)}
@media (max-width:820px){.hero{grid-template-columns:1fr}.navb{display:none}}
@media (max-width:560px){.pill-out{display:none}.sfield{max-width:none}.tcard{flex-basis:78%}.tcard.v{flex-basis:86%}header img{height:28px}}
@media (prefers-reduced-motion:reduce){.poster img,.poster .pl i{transition:none}}
</style>
</head>

<dialog id="dlg" aria-label="Clip de la clase">
  <div class="dlg">
    <button class="x" id="dlgX" type="button" aria-label="Cerrar">×</button>
    <video id="vid" controls playsinline preload="none"></video>
    <div class="dlgb">
      <div><p id="dTip"></p><div class="meta" id="dCls" style="margin-top:4px"></div></div>
      <a class="btn" id="dMore" href="#" target="_blank" rel="noopener">Obtén tu acceso al curso</a>
    </div>
  </div>
</dialog>

<script>
const BASE="https://www.malacamusiclab.com/songwriting";
const C="Teoría y composición";
// Clips: índice del tip -> archivos en /clips/ (video, portada y duración)
const CLIPS={
 13:{v:"clase43-climax.mp4",p:"clase43-climax.jpg",d:"0:57"},
 16:{v:"clase45-audio-a-midi.mp4",p:"clase45-audio-a-midi.jpg",d:"1:01"},
 23:{v:"clase24-kick-bajo.mp4",p:"clase24-kick-bajo.jpg",d:"0:57"}
};
const TT=([
["Composición",7,"Analizando nuestra primera canción","El verso cuenta una historia y es para ti; el coro es para todos. Escribe el coro como algo que el público pueda cantar contigo."],
["Composición",8,"Re-exposición","Repetir no es copiar y pegar. Vuelve al coro con la misma armonía, pero sube el acompañamiento de registro: se siente que la canción avanza."],
["Composición",9,"Partes contrastantes","El contraste no es solo meter un instrumento nuevo. Cambia también la letra, la voz y hasta el largo: verso de 16 compases, coro de 8."],
["Composición",16,"Las duraciones de una frase","Una frase de 8 compases es pregunta y respuesta: los primeros 4 proponen, los otros 4 contestan con una pequeña variación."],
["Composición",20,"Revisando los contrastes","Ponle adjetivos a tus secciones en vez de A y B: «la parte lírica», «el bajo que bombea». Te dice qué necesita cada una."],
["Composición",19,"Cómo generar contraste","Lo que viene después siempre tiene que ser tan o más interesante que lo anterior. Si no, tu canción se desinfla."],
["Composición",25,"Tensión y reposo","Tensión y reposo: si llegas muy rápido al clímax, no entregas el mensaje; si te quedas mucho en el reposo, la canción nunca despega."],
["Composición",28,"Cómo se conectan las partes","Un puente une dos partes muy distintas. Úsalo para meter sonidos que no aparecen en ningún otro lugar de la canción."],
["Composición",33,"Cómo crear ideas que te gusten","¿Te quedaste sin ideas para la forma? Toma la estructura de una canción que te guste: tú solo pones el contenido."],
["Armonía y melodía",14,"Ideas para progresiones","Una progresión sencilla se vuelve interesante con un ostinato: una célula rítmica que se repite con pequeñas variaciones."],
["Armonía y melodía",40,"Cómo creamos melodías","Los saltos en una melodía liberan energía, pero hay que compensarlos con un reposo. Demasiados saltos la vuelven difícil de recordar."],
["Armonía y melodía",41,"El motivo musical","Un motivo de tres o cuatro notas, repetido en distintos grados, le da coherencia a toda tu melodía. Así funcionan los leitmotivs del cine."],
["Armonía y melodía",42,"El contexto armónico","Quedarte siempre dentro de la escala puede sonar obvio. Una nota fuera de lugar, bien puesta, es un riesgo que vale la pena."],
["Armonía y melodía",43,"El clímax de la melodía","El clímax de una frase suele caer entre el 60 y el 80 % de su duración. Lo mismo pasa con la canción completa."],
["Armonía y melodía",44,"Técnicas para crear melodías","Empieza la melodía con un arpegio del acorde para sentar la tonalidad, y luego suelta notas fuera del acorde para que tenga vida propia."],
["Armonía y melodía",44,"Técnicas para crear melodías","¿Un instrumento choca con tu melodía? Cambia la nota del acompañamiento, no la de la melodía: ella manda."],
["Armonía y melodía",45,"AVANCE: Creando melodías","Improvisa sobre tu base, graba y luego usa clic derecho → Convertir melodía en nueva pista MIDI. Tu idea queda lista para editar."],
["Armonía y melodía",31,"AVANCE: Analiza tu música favorita","Un puente que cambia de Sol mayor a Sol menor por un momento genera un color inesperado. Se llama intercambio modal."],
["Beats y bajo",37,"Desarrollo con variaciones","Piensa tu loop de batería como una frase: que tenga un remate al final antes de volver a empezar."],
["Beats y bajo",37,"Desarrollo con variaciones","Agrega ghost notes en la caja con velocity baja. Le dan vida a un beat sin llenarlo de golpes."],
["Beats y bajo",37,"Desarrollo con variaciones","Programa tu batería como si la tocara alguien real: un baterista solo tiene dos brazos y dos pies."],
["Beats y bajo",23,"Cómo añadir un bajo","Para un bajo: primero toca la fundamental de cada acorde, luego dale un motivo rítmico y al final suma la quinta y la octava."],
["Beats y bajo",22,"Líneas de bajo características","Técnica de dos bajos: uno para el sub y otro para los medios graves. Así suena profundo en audífonos y en bocinas pequeñas."],
["Beats y bajo",24,"AVANCE: Escribe un bajo","Que el kick y el bajo tomen turnos, como en un diálogo. Selecciona ambos clips con Shift para verlos juntos en el editor MIDI."],
["Beats y bajo",21,"Taller de bajo","El bajo define la armonía: si tocas Sol debajo de un Do mayor, ya no es el mismo acorde."],
["Beats y bajo",21,"Taller de bajo","En el Electric Bass de Live, la velocity cambia la técnica: notas muertas, cuerda abierta o slap. Juega con ella."],
["Arreglo y mezcla",47,"La única regla","La única regla del arreglo: menos es más. Cada instrumento tiene que ser relevante, sea protagonista o soporte."],
["Arreglo y mezcla",47,"La única regla","Prueba de parejas: escucha tus elementos de dos en dos. Si cada pareja suena interesante, nadie está copiando a nadie."],
["Arreglo y mezcla",47,"La única regla","En la sección contrastante, cambia la paleta de sonidos. Dos sintes tocando las mismas notas crean un timbre más grande."],
["Arreglo y mezcla",52,"AVANCE: Haz un arreglo","¿Una muestra de voz trae graves? Quítaselos con un EQ y deja ese espacio para tu bajo. La mezcla empieza en el arreglo."],
["Arreglo y mezcla",52,"AVANCE: Haz un arreglo","Para cerrar una canción, re-expón los sonidos del inicio en el final. Se siente como un círculo que se completa."],
["Arreglo y mezcla",49,"Taller de instrumentos orquestales","Dobla la melodía de los violines a la octava entre primeros y segundos: suena más grande sin escribir notas nuevas."],
["Arreglo y mezcla",50,"Orquestación de una canción","En las secciones de Orchestral Strings, automatiza el Chain Selector para pasar de legato a pizzicato a lo largo de la pieza."],
["Arreglo y mezcla",51,"Consideraciones de arreglo","Crear la idea y arreglarla son dos momentos distintos. Primero un piano rápido; los timbres finales cuando la idea ya tiene futuro."],
["Letras",54,"Ritmización de textos","Haz coincidir las sílabas acentuadas de tu letra con los tiempos fuertes del compás: en 4/4, el 1 y el 3."],
["Letras",55,"Sílabas, sinalefas y hiatos","Usa sinalefas: une la vocal final de una palabra con la siguiente en una sola nota («escalera‿arriba»). La línea fluye mejor."],
["Letras",56,"Melismas y adornos","Un melisma, varias notas sobre una misma sílaba, sirve para destacar la palabra más importante de tu frase."],
["Letras",58,"Sugerencias de uso del texto","La puntuación de tu letra te dice dónde respirar. En frases largas, deja espacio para que quien canta tome aire."],
["Letras",58,"Sugerencias de uso del texto","Usa segundas voces como un marcatextos: solo en las frases que quieres subrayar, como el coro."],
["Letras",59,"AVANCE: Del texto a la melodía","Aunque no seas cantante, graba una demo cantada. Le da a quien interpreta una idea clara de tu intención."],
["Creatividad y atajos",33,"Cómo crear ideas que te gusten","Con 20 minutos al día alcanza para dos ideas. Trabaja en bloques cortos con descansos, como la técnica Pomodoro."],
["Creatividad y atajos",34,"Quitando el freno a tu creatividad","Guarda en tus Colecciones los sonidos de la temporada y rótalos. Dejas de buscar sonidos y te enfocas en ideas."],
["Creatividad y atajos",34,"Quitando el freno a tu creatividad","Ordena tus instrumentos por uso en el navegador y abre el que nunca tocas. Un poco de caos destraba ideas."],
["Creatividad y atajos",38,"AVANCE: De la idea a la canción","Ponte un límite de tiempo para navegar presets. Si no aparece, regresa a tu sinte de confianza y sigue creando."],
["Creatividad y atajos",15,"La técnica del borrador","Comping creativo: graba varias tomas en loop sobre la misma frase y arma la toma perfecta con los mejores pedazos."],
["Creatividad y atajos",60,"Terminando tus composiciones","¿Callejón sin salida? Descansa y regresa con otra perspectiva. Si cinco ideas salen mal, la sexta puede ser la buena."],
["Creatividad y atajos",37,"Desarrollo con variaciones","Atajos del editor MIDI: Cmd+1 y Cmd+2 cambian la rejilla, Cmd+3 activa tresillos y 0 desactiva notas sin borrarlas."],
["Creatividad y atajos",13,"Taller de piano y teclado","¿No tienes pedal de sustain? Dibújalo: es el CC 64 en las envolventes del clip. Cámbialo cada vez que cambie el acorde."]
]).map(([cat,n,cls,tip],i)=>({i,cat,n,cls,tip,curso:C,clip:CLIPS[i]||null}));
// Solo se muestran los tips que ya tienen clip; los demás esperan su video.
const T=TT.filter(t=>t.clip);
const link=(t,m)=>`${BASE}?utm_source=tip_live&utm_medium=${m||"web"}&utm_content=clase${t.n}`;
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
let q="", view=null, sel=new Set(), onlyVid=false;
try{const st=JSON.parse(localStorage.getItem("tips-filtros-v2")||"{}");(st.cats||[]).forEach(c=>sel.add(c));onlyVid=false;}catch(e){}
const save=()=>{try{localStorage.setItem("tips-filtros-v2",JSON.stringify({cats:[...sel],vid:onlyVid}));}catch(e){}}; // view = null (filas) | "Con video" | categoría
const cats=[...new Set(T.map(t=>t.cat))];
[...sel].forEach(c=>{if(!cats.includes(c))sel.delete(c);});
const withClip=T.filter(t=>t.clip);
let hero=withClip.length?withClip[Math.floor(Math.random()*withClip.length)]:T[0];

function hl(s){
  if(!q)return esc(s); const n=norm(q),ns=norm(s),o=[];let i=0,k;
  while((k=ns.indexOf(n,i))>-1){o.push(esc(s.slice(i,k)),"<mark>",esc(s.slice(k,k+n.length)),"</mark>");i=k+n.length;}
  o.push(esc(s.slice(i)));return o.join("");
}
function card(t){
  if(t.clip)return `<article class="tcard v"><button class="poster" type="button" data-play="${t.i}" aria-label="Ver clip: ${esc(t.tip)}"><img src="clips/${t.clip.p}" alt="" loading="lazy"><span class="pl"><i></i></span><span class="dur">${t.clip.d}</span></button><div class="tb"><p>${hl(t.tip)}</p><div class="foot"><span class="cls">Clase ${t.n}</span><a class="more" href="${link(t)}" target="_blank" rel="noopener">Quiero saber más →</a></div></div></article>`;
  return `<article class="tcard"><div class="tb"><span class="chip" style="align-self:flex-start">${esc(t.cat)}</span><p>${hl(t.tip)}</p><div class="foot"><span class="cls">Clase ${t.n} · ${hl(t.cls)}</span><a class="more" href="${link(t)}" target="_blank" rel="noopener">Quiero saber más →</a></div></div></article>`;
}
const sortClipsFirst=a=>[...a].sort((x,y)=>(y.clip?1:0)-(x.clip?1:0));
function shelf(title,list,key){
  return `<section class="shelf"><div class="shead"><h2>${esc(title)}<small>${list.length}</small></h2><button class="seeall" type="button" data-view="${esc(key)}">Ver todos →</button></div><div class="track"><button class="navb l" type="button" aria-label="Anterior" disabled>‹</button><div class="row">${list.map(card).join("")}</div><button class="navb r" type="button" aria-label="Siguiente">›</button></div></section>`;
}
function renderTags(){
  const all=!sel.size;
  $("tags").innerHTML=`<button class="tag" type="button" data-t="__all" aria-pressed="${all}">Todos <b>${T.length}</b></button>`+
    cats.map(c=>`<button class="tag" type="button" data-t="${esc(c)}" aria-pressed="${sel.has(c)}">${esc(c)} <b>${T.filter(t=>t.cat===c).length}</b></button>`).join("");
}
function render(){
  const sh=$("shelves");
  $("hero").hidden=!!(q||view); $("filters").hidden=!!(q||view);
  if(q){
    const n=norm(q), r=T.filter(t=>norm(t.tip+" "+t.cls+" "+t.cat).includes(n));
    sh.innerHTML=`<section class="shelf"><div class="shead"><h2>Resultados para «${esc(q)}»<small>${r.length}</small></h2></div>${r.length?`<div class="grid">${sortClipsFirst(r).map(card).join("")}</div>`:`<div class="empty">No hay tips con «${esc(q)}». Prueba con otra palabra: bajo, melodía, coro, kick…</div>`}</section>`;
  }else if(view){
    const r=T.filter(t=>t.cat===view);
    sh.innerHTML=`<button class="btn ghost back" type="button" id="back">← Todos los temas</button><section class="shelf"><div class="shead"><h2>${esc(view)}<small>${r.length}</small></h2></div><div class="grid">${sortClipsFirst(r).map(card).join("")}</div></section>`;
    $("back").addEventListener("click",()=>{view=null;render();scrollTo({top:0,behavior:"smooth"});});
  }else{
    let h="";
    const show=sel.size?cats.filter(c=>sel.has(c)):cats;
    show.forEach(c=>{const l=T.filter(t=>t.cat===c);if(l.length)h+=shelf(c,sortClipsFirst(l),c);});
    if(!h)h=`<div class="empty">Pronto se suman más clips en este tema.</div>`;
    sh.innerHTML=h;
    sh.querySelectorAll(".track").forEach(tr=>{
      const row=tr.querySelector(".row"),l=tr.querySelector(".l"),r=tr.querySelector(".r");
      const upd=()=>{l.disabled=row.scrollLeft<8;r.disabled=row.scrollLeft+row.clientWidth>=row.scrollWidth-8;};
      l.addEventListener("click",()=>row.scrollBy({left:-row.clientWidth*.85,behavior:"smooth"}));
      r.addEventListener("click",()=>row.scrollBy({left:row.clientWidth*.85,behavior:"smooth"}));
      row.addEventListener("scroll",upd,{passive:true});upd();
    });
  }
}
function showHero(){
  const t=hero;
  $("hTip").textContent=t.tip;$("hCat").textContent=t.cat;$("hCls").textContent=`Clase ${t.n} · ${t.cls}`;$("hMore").href=link(t);
  if(t.clip){$("hImg").src="clips/"+t.clip.p;$("hDur").textContent=t.clip.d;$("hPoster").hidden=false;$("hPlay").hidden=false;}
  else{$("hPoster").hidden=true;$("hPlay").hidden=true;}
}
function openClip(t){
  $("vid").poster="clips/"+t.clip.p;$("vid").src="clips/"+t.clip.v;$("dTip").textContent=t.tip;$("dCls").textContent=`Clase ${t.n} · ${t.cls} · ${t.curso}`;$("dMore").href=link(t,"clip");
  if($("dlg").showModal)$("dlg").showModal();else $("dlg").setAttribute("open","");
  $("vid").play().catch(()=>{});
}
function closeClip(){$("vid").pause();$("vid").removeAttribute("src");$("vid").load();if($("dlg").close)$("dlg").close();else $("dlg").removeAttribute("open");}

$("hPoster").addEventListener("click",()=>openClip(hero));
$("hPlay").addEventListener("click",()=>openClip(hero));
$("dlgX").addEventListener("click",closeClip);
$("dlg").addEventListener("close",()=>$("vid").pause());
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))closeClip();});
$("shelves").addEventListener("click",e=>{
  const p=e.target.closest("[data-play]");if(p){openClip(T[+p.dataset.play]);return;}
  const v=e.target.closest("[data-view]");if(v){view=v.dataset.view;render();scrollTo({top:0,behavior:"smooth"});}
});
$("tags").addEventListener("click",e=>{const b=e.target.closest(".tag");if(!b)return;const t=b.dataset.t;
  if(t==="__all"){sel.clear();onlyVid=false;}else if(t==="__vid"){onlyVid=!onlyVid;}else{sel.has(t)?sel.delete(t):sel.add(t);}
  save();renderTags();render();});
let qt;$("q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{q=e.target.value.trim();render();},120);});
showHero();renderTags();render();
</script>
